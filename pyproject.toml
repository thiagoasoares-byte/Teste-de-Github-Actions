[tool.poetry]
name = "fastapi-app"
version = "0.1.0"
description = "API de exemplo para pipeline de CI com GitHub Actions"
authors = ["Thiago Alves Soares"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.110.0"
uvicorn = { extras = ["standard"], version = "^0.29.0" }

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
